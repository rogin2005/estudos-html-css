<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <!-- imagem pequena -->
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <!-- imagem media -->
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <!-- imagem base/grande -->
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>

    <h1>Reproduzindo Audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5.</p>
    <!-- <audio src="midia/goodfortheghost.mp3" controls></audio> -->
    <!-- mp3 wav ogg -->
     <audio preload="metadata" autoplay controls loop>
        <source src="midia/goodfortheghost.mp3" type="audio/mpeg">
        <source src="midia/goodfortheghost.ogg" type="audio/ogg">
        <source src="midia/goodfortheghost.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir audio. <a href="midia/goodfortheghost.mp3">Clique aqui para baixar o arquivo MP3</a></p>
     </audio>
</body>
</html>
