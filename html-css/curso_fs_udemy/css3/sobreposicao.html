        .caixa {
            background-color: purple;
            width: 100%;
            position: relative;
        }

        .destaque {
            background-color: orange;
            color: white;
            width: 150px;
            text-align: center;
            border-radius: 50px;
            padding: 10px;
            position: absolute;
            bottom: 2.5em;
        }

        .promocao {
            background-color: white;
            color: purple;
            border: 3px dotted purple;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            padding: 1em;
            text-align: center;
            position: absolute;
            bottom: -1.8em;
            left: 10%;
            right: 10%;
        }

    </style>

</head>
<body>

    <h1>Exercício</h1>
    <div class="caixa">

        <img src="img/banner.png" alt="banner" width="700">

        <div class="destaque">
            Tempo limitado
        </div>

        <div class="promocao">
            Quero a promoção
        </div>

    </div>
