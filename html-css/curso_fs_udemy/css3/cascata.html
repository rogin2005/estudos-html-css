<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascata e herança no CSS</title>

    <!-- 
    
        CSS -> Cascading Style Sheet
        Efeito cascata CSS

        <link rel="stylesheet" href="css/estilo.css">

    -->

    

    <style>

        div {
            color: orange;
            border: 3px solid red;
        }

        

    </style>

</head>
<body>
    
    <div style="color: red;"> parent -> p
        
        <p> parent -> span
            Filho da div
            <span>filho do paragrafo</span>
        </p>
    </div>

</body>
</html>
