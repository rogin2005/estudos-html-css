<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes customizadas</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Lobster&display=swap');

        @font-face {
            font-family: 'Bruxa';
            src: url(fonts/halloween_4/halloween.woff2),
                 url(fonts/halloween_4/halloween.woff),
                 url(fonts/halloween_4/halloween.ttf);
        }

        h1 {
            font-family: 'Bruxa', Arial, Helvetica, sans-serif;
        }

        h2 {
            font-family: 'Lobster', sans-serif;
            font-size: 4em;
        }

        p {
            font-family: 'BBH Bartle', sans-serif;
        }

    </style>

</head>
<body>
    
    <h1>Feliz Natal</h1>
    <h2>boas festas</h2>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Corrupti possimus deserunt esse quo iure nobis natus ea quod doloremque? Placeat esse iste eum voluptates incidunt reiciendis. Doloribus ad amet asperiores!
    </p>

</body>
</html>
