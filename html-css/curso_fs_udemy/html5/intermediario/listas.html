<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas ordenadas e não ordenadas</title>
</head>
<body>
    
    <!--
        ul -> Unordered List (lista não ordenada)
        ol -> Ordered List (lista ordenada)
        li -> List Item (Item da lista)
    -->

    <h2>Lista não ordenada (menus)</h2>
    <!--
    type="disc" circle, square, disc
    style="list-style-type:square"
    -->
    <ul style="list-style-type: circle;">
        <li>Veículos</li>
        <li>
            Tecnologia
            <ul>
                <li>Celulares e telefones</li>
                <li>Câmeras e acessórios</li>
            </ul>
        </li>
    </ul>

    <h2>Lista ordenada (lista de compras)</h2>
    <!--
    type="1" 1, a, A, i, I
    style="list-style-type: upper-roman;"
    -->
    <ol style="list-style-type: cjk-ideographic;">
        <li>Melancia</li>
        <li>Molho de tomate</li>
        <li>Macarrão</li>
        <li>
            Geleia
            <ol>
                <li>Sub item de Geleia</li>
                <li>Sub item de Geleia</li>
                <li>Sub item de Geleia</li>
            </ol>
        </li>
    </ol>

</body>
</html>
