<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executando vídeos</title>
</head>
<body>
    
    <h1>Executando vídeos</h1>
    <!--
        source -> fonte
        controls -> controles
        muted -> mutado
        autoplay -> Reprodução automática
        loop -> ciclo
        poster -> cartaz
        -->
    <video width="400" controls muted poster="imagens/item1.jpeg">
        <source src="videos/abelhas.mp4" type="video/mp4">
        Seu navegador não suporte a execução desse vídeo
    </video>

    <!-- interessante o iframe uma tag utilizada para carregar videos externos, serve tbm para carregar páginas e demais conteudos, aqui abaixo carregamos uma pagina que tinhamos feito anteriormente de produtos, tag muito interessante! -->
    <iframe src="produtos.html" width="600" height="300"></iframe>

    <!-- <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/B4iDJWQyr_M?si=nDYk5nZde3aROgrD" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> -->

</body>
</html>
