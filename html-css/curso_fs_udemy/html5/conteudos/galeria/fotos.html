<body>

    <!--
        img - Image (imagem)
        src - Source (fonte, origem)
        alt - alternative (alternativa)
        tipos imagem: png, jpg, jpeg, gif
        ../ - sobe um nível de pastas, caminho relativo de onde estou.
        title - cria o texto de ajuda da imagem. 
        Caminho relativo
        <img src="../../arquivos/imagens/praia.jpeg"

        Caminho absoluto
        / -> utiliza caminho absoluto do projeto, no caso "html-css"

    -->

    <a href="../../imagens.html">Imagens</a>

    <img src="../../arquivos/imagens/praia5.jpg"
        alt="Imagem de uma praia bonita" 
        width="300" 
        title="Praia da boa vista"
        >
