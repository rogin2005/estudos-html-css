<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <h1>Tabelas - Exercício</h1>

    <table border="1">
        <caption>Lista de países mais populares</caption>

        <thead>
            <tr>
                <th>Posição</th>
                <th>País</th>
                <th>População aproximada (milhões)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td><img src="imagens/b1.jpg" alt="img china">China</td>
                <td>1.440</td>
            </tr>
            <tr>
                <td>2</td>
                <td><img src="imagens/b2.jpg" alt="img india">Índia</td>
                <td>1.380</td>
            </tr>
            <tr>
                <td>3</td>
                <td><img src="imagens/b3.jpg" alt="img EUA">Estados Unidos</td>
                <td>331</td>
            </tr>
            <tr>
                <td>4</td>
                <td><img src="imagens/b4.jpg" alt="img indonesia">Indonésia</td>
                <td>273</td>
            </tr>
            <tr>
                <td>5</td>
                <td><img src="imagens/b5.jpg" alt="img paquistão">Paquistão</td>
                <td>220</td>
            </tr>
            <tr>
                <td>6</td>
                <td><img src="imagens/b6.jpg" alt="img brasil">Brasil</td>
                <td>212</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">fonte: ficticio.com.br</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
