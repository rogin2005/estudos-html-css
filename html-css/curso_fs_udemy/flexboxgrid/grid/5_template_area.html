<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>

        body {
            font-size: 1.2rem;
            background-color: black;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .grid {
            border: 5px solid red;
            row-gap: 20px;
            column-gap: 20px;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-areas: 
                'cabecalho'
                'navegacao'
                'principal'
                'rodape'
            ;
            
        }

        /* celular, tablet, notebook 
        0 até 600px
        min-width 600 até 1200
        min-width 1200
        */
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 2fr;
                grid-template-areas: 
                    'cabecalho cabecalho'
                    'navegacao principal'
                    'rodape rodape'
                ;
            }
        }

        @media (min-width: 1200px) {
            .grid {
                grid-template-columns: 1fr 2fr;
                grid-template-areas: 
                    'cabecalho cabecalho'
                    'navegacao principal'
                    'navegacao rodape'
                ;
            }
        }

        
        header, nav, main, footer {
            /* padding: 3rem; */
            border: 5px solid aqua;
        }

        header {
            grid-area: cabecalho;
        }
        nav {
            grid-area: navegacao;
        }
        main {
            grid-area: principal;
        }
        footer {
            grid-area: rodape;
        }

    </style>

</head>
<body>
    
    <div class="grid">
        <header>Cabeçalho</header>
        <nav>menu de navegação</nav>
        <main>
            <h2>Conteudo do sistema</h2>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae amet consequatur quod optio ipsa beatae. Sunt, nemo! Voluptas id error non culpa repellat corporis, commodi, sunt illo eveniet dolorum accusantium.
            </p>
        </main>
        <footer>Rodapé</footer>
    </div>

</body>
</html>
